<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="favicon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <script>
      (async () => {
        try {
          const response = await fetch('/api/functions/getBrandSettings', { method: 'POST' });
          const settings = await response.json();
          if (settings?.favicon_url) {
            document.getElementById('favicon').href = settings.favicon_url;
          }
        } catch (e) {
          console.error('Failed to load brand settings');
        }
      })();
    </script>
    <!-- MyFatoorah Embedded Payment SDK (demo) -->
    <script src="https://demo.myfatoorah.com/sessions/v1/session.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
